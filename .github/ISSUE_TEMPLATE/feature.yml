name: Feature request
description: Something Inkuna should do. Agree the approach here before a pull request.
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How Inkuna could solve it, and what it would change for people who use it now.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve it, and why this one.
