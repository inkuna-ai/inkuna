name: Docs

# The checks that read the documentation, for the changes ci.yml skips. A
# change that also touches anything else runs ci.yml, whose task ci includes
# both of these. Keep the paths the same as the paths-ignore lists in ci.yml.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "*.md"
      - "NOTICE"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - "NOTICE"
      - ".github/workflows/docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Every doc carries the frontmatter contract and its links resolve.
      - name: Check the docs contract
        run: go test ./internal/docs/
      - run: npm ci --prefix frontend
      # Every Mermaid diagram in docs/ parses.
      - name: Check the diagrams
        run: npm test --prefix frontend -- --run src/views/docs/diagrams.test.ts
